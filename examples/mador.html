<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>mador.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-8 bg-gray-50 text-gray-900">
    <header class="py-4 flex justify-center">
      mador.js - Reactive DOM for those who don't need a framework.
    </header>
    <script type="module">
      import mador from "../dist/mador.js";
      const [r, w] = mador({
        count: 1,
        user: { details: { name: "John" } },
      });

      r(
        ".counter",
        (el, count) => {
          el.textContent = `Count: ${count}`;
        },
        (state) => state.count,
      );
      r(
        ".counter-double",
        (el, count) => {
          el.textContent = count * 2;
        },
        (state) => state.count,
      );
      r(
        ".user-name",
        (el, [user, count]) => {
          el.textContent = `${user.details.name} - count=${count}`;
        },
        (state) => [state.user, state.count],
      );

      document.querySelector("#incrBtn").addEventListener("click", () => {
        w((state) => {
          state.count++;
        });
      });

      setTimeout(() => {
        w((state) => {
          state.count = (c) => c * 6;
          state.user = { details: { name: "John Doe" } };
        });
      }, 4000);
    </script>
    <main
      class="flex flex-col sm:flex-row items-center justify-center gap-6 max-w-xl mx-auto p-8 bg-slate-900 text-slate-100 rounded-2xl shadow-2xl border border-slate-800"
    >
      <div class="flex flex-col gap-1 text-center sm:text-left">
        <h2 class="user-name text-xl font-bold tracking-tight text-white"></h2>
        <div class="flex items-center gap-4 text-sm text-slate-400">
          <span class="counter"></span>
          <span class="counter-double"></span>
        </div>
      </div>
      <button
        id="incrBtn"
        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200 cursor-pointer"
      >
        Increment
      </button>
    </main>
  </body>
</html>
