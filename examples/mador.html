<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>mador.js</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-8 bg-gray-50 text-gray-900">
    <header class="py-4 flex justify-center">
      mador.js - Reactive DOM for those who don't need a framework.
    </header>
    <script type="module">
      import mador from "../dist/mador.js";
      const [r, w] = mador({
        count: 1,
        user: { details: { name: "Santje" } },
      });

      r(
        ".counter",
        (el, count) => {
          el.textContent = `Count: ${count}`;
          el.hidden = count < 7;
        },
        (state) => state.count,
      );
      r(
        ".counter-double",
        (el, count) => {
          el.textContent = count * 2;
        },
        (state) => state.count,
      );
      r(
        ".user-name",
        (el, [user, count]) => {
          el.textContent = user.details.name;
        },
        (state) => [state.user, state.count],
      );
      document.querySelector("#incrBtn").addEventListener("click", () => {
        w((state) => {
          state.count++;
        });
      });

      setTimeout(() => {
        w((state) => {
          state.count = (c) => c * 6;
          state.user = { details: { name: "John Doe" } };
        });
      }, 4000);
    </script>
    <main class="flex gap-2 max-w-4xl mx-auto justify-center">
      <h2 class="user-name"></h2>
      <div class="counter"></div>
      <div class="counter-double"></div>
      <button id="incrBtn">Increment</button>
    </main>
  </body>
</html>
